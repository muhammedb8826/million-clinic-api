# Hostinger VPS — OpenLiteSpeed / LiteSpeed in front of Docker Strapi
# In LiteSpeed WebAdmin → Virtual Hosts → your domain → Script Handler / Context
# Or add to the vhost config file for mako-portal.qenenia.com

# 1. Raise max upload body size (WebAdmin → Server → Tuning → Max Request Body Size)
#    Set to 256M or higher.

# 2. If uploads still return 406 HTML, ModSecurity/WAF is blocking multipart POST.
#    WebAdmin → Virtual Hosts → Security → ModSecurity → disable for this vhost
#    OR whitelist URI /upload

# 3. Reverse proxy to Docker (port 3001) — External App example:
#    Type: proxy
#    Address: http://127.0.0.1:3001
#    Max connections: 100

# 4. Map context:
#    URI: /
#    Handler: proxy (the external app above)
