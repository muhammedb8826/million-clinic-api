# Hostinger VPS — nginx reverse proxy in front of Docker Strapi (port 3001)
# Place in /etc/nginx/sites-available/mako-portal.qenenia.com (or your vhost path)
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name mako-portal.qenenia.com;

    # Required for video uploads (default is often 1m)
    client_max_body_size 256M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Large uploads can take time
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
